<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Genre Vibes — Music Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1 class="title">Sound Palette</h1>
      <p class="subtitle">Press a beat — paint the mood!</p>
    </div>
  </header>

  <main class="main" id="main" role="main">
    <section class="controls" aria-label="Playback controls">
      <label class="volume-label" for="volume">Volume: <span id="volumeValue">80%</span></label>
      <input id="volume" class="volume" type="range" min="0" max="100" value="80" aria-labelledby="volumeValue">
      <button id="muteBtn" class="mute-btn" aria-pressed="false" aria-label="Mute">🔇</button>
    </section>

    <section class="board" aria-label="Genre board">
      
      <button class="pad" data-genre="theme-rock" data-src="rock.mp3" aria-label="Play Rock sample">
        <div class="pad-icon">🎸</div>
        <div class="pad-label">Rock</div>
      </button>

      <button class="pad" data-genre="theme-pop" data-src="pop.mp3" aria-label="Play Pop sample">
        <div class="pad-icon">✨</div>
        <div class="pad-label">Pop</div>
      </button>

      <button class="pad" data-genre="theme-edm" data-src="edm.mp3" aria-label="Play EDM sample">
        <div class="pad-icon">🔊</div>
        <div class="pad-label">EDM</div>
      </button>

      <button class="pad" data-genre="theme-classical" data-src="Classical1.mp3" aria-label="Play Classical sample">
        <div class="pad-icon">🎻</div>
        <div class="pad-label">Classical</div>
      </button>

      <button class="pad" data-genre="theme-hiphop" data-src="hip-hop.mp3" aria-label="Play Hip-hop sample">
        <div class="pad-icon">🎤</div>
        <div class="pad-label">Hip-Hop</div>
      </button>

      <button class="pad" data-genre="theme-lofi" data-src="lo-fi.mp3" aria-label="Play Lofi sample">
        <div class="pad-icon">☕</div>
        <div class="pad-label">Lofi</div>
      </button>
    </section>

  
  </main>

  <footer class="site-footer" role="contentinfo">
    <small></small>
  </footer>

   <script src="script.js"></script>
</body>
</html>
